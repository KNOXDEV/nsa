[package]
name = "nsa"
version = "0.3.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serenity = { version = "0.12.5", default-features = false, features = ["client", "collector", "gateway", "rustls_backend", "model", "chrono"] }
tokio-postgres = { version = "0.7.17", features = ["with-chrono-0_4"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
rand = "0.10.1"
chrono = "0.4.44"
regex = "1.12.3"
lazy_static = "1.5.0"
